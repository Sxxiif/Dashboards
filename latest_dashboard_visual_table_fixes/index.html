<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Offline Weekly Dashboard</title>
<style>
    :root {
      --bg: #070b13;
      --bg-2: #0b1220;
      --panel: #111a2d;
      --panel-2: #151f34;
      --panel-3: #0f1728;
      --text: #e8eefc;
      --muted: #9aa8c4;
      --line: rgba(255,255,255,.10);
      --line-2: rgba(255,255,255,.16);
      --accent: #60a5fa;
      --accent-2: #7c3aed;
      --good: #22c55e;
      --warn: #eab308;
      --bad: #ef4444;
      --info: #38bdf8;
      --shadow: 0 24px 70px rgba(0,0,0,.38);
      --radius: 18px;
      --radius-sm: 12px;
      --input: #0c1424;
      --body-bg: radial-gradient(circle at top left, rgba(96,165,250,.18), transparent 38%), radial-gradient(circle at top right, rgba(124,58,237,.16), transparent 32%), linear-gradient(135deg, var(--bg), #0a1020 52%, #090d17);
      --chart-text: #cbd5e1;
      --chart-grid: rgba(255,255,255,.20);
      --soft-surface: rgba(255,255,255,.035);
    }

    body.theme-light {
      --bg: #eef4ff;
      --bg-2: #f8fafc;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --panel-3: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --line: rgba(15,23,42,.12);
      --line-2: rgba(15,23,42,.20);
      --accent: #2563eb;
      --accent-2: #7c3aed;
      --good: #16a34a;
      --warn: #ca8a04;
      --bad: #dc2626;
      --info: #0284c7;
      --shadow: 0 22px 55px rgba(15,23,42,.12);
      --input: #ffffff;
      --body-bg: radial-gradient(circle at top left, rgba(37,99,235,.12), transparent 34%), radial-gradient(circle at top right, rgba(124,58,237,.10), transparent 32%), linear-gradient(135deg, #eef4ff, #f8fafc 58%, #e8eef8);
      --chart-text: #334155;
      --chart-grid: rgba(15,23,42,.18);
      --soft-surface: rgba(15,23,42,.035);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--body-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 28px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0 16px;
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 245px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 16px 42px rgba(96,165,250,.22);
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: -.03em;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 19px; letter-spacing: -.02em; }
    .subtle { color: var(--muted); font-size: 13px; line-height: 1.45; }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 245px;
    }


    .week-switcher {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
      border: 1px solid rgba(96,165,250,.18);
      border-radius: 16px;
      background: rgba(7,11,19,.34);
      min-width: 320px;
    }
    .week-chip {
      min-width: 190px;
      padding: 7px 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
      text-align: center;
      line-height: 1.25;
    }
    .week-chip span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .week-chip strong {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #dbeafe;
      white-space: nowrap;
    }
    .week-date-input {
      width: 132px;
      min-height: 32px;
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 12px;
    }

    .btn {
      border: 1px solid var(--line-2);
      background: rgba(17,26,45,.78);
      color: var(--text);
      padding: 10px 13px;
      border-radius: 12px;
      min-height: 40px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: rgba(96,165,250,.55); background: rgba(24,36,61,.92); }
    .btn.primary { background: linear-gradient(135deg, #2563eb, #7c3aed); border-color: transparent; }
    .btn.danger { border-color: rgba(239,68,68,.36); color: #fecaca; }
    .btn.good { border-color: rgba(34,197,94,.38); color: #bbf7d0; }
    .btn.small { padding: 7px 9px; min-height: 32px; font-size: 12px; border-radius: 10px; }
    .btn.ghost { background: transparent; }

    .view { display: none; }
    .view.active { display: block; animation: fadeIn .22s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .hero {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 34px;
      background:
        linear-gradient(135deg, rgba(17,26,45,.92), rgba(15,23,42,.76)),
        radial-gradient(circle at 15% 15%, rgba(96,165,250,.24), transparent 30%);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .hero:after {
      content: "";
      position: absolute;
      right: -120px;
      top: -120px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(124,58,237,.22), transparent 66%);
      pointer-events: none;
    }

    .hero h2 { font-size: clamp(30px, 4vw, 54px); letter-spacing: -.05em; line-height: 1; max-width: 900px; }
    .hero p { margin-top: 14px; color: var(--muted); max-width: 850px; line-height: 1.65; }

    .page-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin: 20px 0 16px;
    }
    .page-title h2 { font-size: 30px; letter-spacing: -.04em; }

    .grid { display: grid; gap: 16px; }
    .team-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 22px; }
    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(17,26,45,.94), rgba(13,20,35,.94));
      box-shadow: 0 16px 42px rgba(0,0,0,.22);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }
    .team-card { min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; }
    .team-card:before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(96,165,250,.12), transparent 42%);
      pointer-events: none;
    }
    .team-card h3, .card h3 { font-size: 18px; letter-spacing: -.02em; position: relative; }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-head.wrap { align-items: flex-start; flex-wrap: wrap; }

    .kpi {
      min-height: 128px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: space-between;
    }
    .kpi .value { font-size: 34px; font-weight: 900; letter-spacing: -.05em; }
    .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }

    .section { margin-top: 16px; }
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; background: var(--accent); }
    .dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

    .input, textarea, select {
      width: 100%;
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      padding: 10px 11px;
      outline: none;
      min-height: 40px;
    }
    textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
    .inline-input { min-width: 150px; }
    .input:focus, textarea:focus, select:focus { border-color: rgba(96,165,250,.75); box-shadow: 0 0 0 4px rgba(96,165,250,.10); }


    /* Dark native controls: fixes light dropdown menu text and date calendar icon visibility on VDI browsers. */
    select, .cell-select, input[type="date"] { color-scheme: dark; }
    select option, .cell-select option {
      background: #0f1728;
      color: #e8eefc;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) brightness(1.9) contrast(1.05);
      opacity: .82;
      cursor: pointer;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

    .auto-grow {
      min-height: 46px;
      height: auto;
      overflow: hidden;
      resize: none;
    }
    .daily-task-textarea { min-height: 52px; }

    .top-analytics-card {
      border-color: rgba(96,165,250,.22);
      background:
        radial-gradient(circle at top left, rgba(96,165,250,.13), transparent 34%),
        linear-gradient(180deg, rgba(17,26,45,.96), rgba(10,16,28,.96));
    }
    .chart-legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .legend-line { width: 18px; height: 3px; border-radius: 99px; display: inline-block; background: var(--accent); }
    .legend-line.green { background: var(--good); }
    .legend-line.warn { background: var(--warn); }
    .legend-line.info { background: var(--info); }

    .concern-card {
      border-color: rgba(251,191,36,.34);
      background:
        linear-gradient(180deg, rgba(34,28,13,.72), rgba(16,22,34,.96));
    }
    .concern-card .inline-input {
      border-color: rgba(251,191,36,.30);
      background: rgba(251,191,36,.08);
      font-weight: 800;
    }
    .concern-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .concern-entry {
      margin-top: 0;
      min-height: 44px;
      padding: 7px 8px 7px 12px;
      border-color: rgba(251,191,36,.32);
      background: linear-gradient(90deg, rgba(251,191,36,.16), rgba(251,191,36,.055));
      border-left: 4px solid #fbbf24;
      box-shadow: none;
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }
    .concern-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #fbbf24;
      box-shadow: 0 0 0 4px rgba(251,191,36,.12);
    }
    .concern-line-input {
      min-height: 32px;
      padding: 6px 8px;
      border-radius: 9px;
      background: rgba(7,11,19,.45);
      border: 1px solid rgba(251,191,36,.18);
      color: #fff7d6;
      width: 100%;
      outline: none;
    }
    .concern-line-input:focus { border-color: rgba(251,191,36,.60); box-shadow: 0 0 0 3px rgba(251,191,36,.10); }
    .concern-time { color: #fde68a; font-size: 11px; white-space: nowrap; opacity: .78; }
    .concern-actions { display: flex; justify-content: flex-end; }

    .label-input {
      width: auto;
      min-width: 120px;
      max-width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      font-weight: 800;
      padding: 4px 6px;
      border-radius: 8px;
    }
    .label-input:hover, .label-input:focus { border-color: var(--line-2); background: rgba(255,255,255,.04); outline: none; }
    .th-label-input {
      width: 150px;
      min-width: 110px;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 800;
      padding: 3px 5px;
      border-radius: 7px;
    }
    .th-label-input:hover, .th-label-input:focus { border-color: var(--line-2); background: rgba(255,255,255,.04); outline: none; }

    .table-wrap { width: 100%; overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; min-width: 850px; background: rgba(8,13,24,.46); }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: #cbd5e1; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; background: rgba(255,255,255,.04); white-space: nowrap; }
    td { color: var(--text); font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    tr.urgent-row td { background: rgba(239,68,68,.08); }
    .cell-input, .cell-select {
      min-width: 110px;
      width: 100%;
      background: rgba(255,255,255,.035);
      border: 1px solid transparent;
      color: var(--text);
      padding: 8px;
      border-radius: 9px;
      outline: none;
    }
    .cell-input:focus, .cell-select:focus { border-color: rgba(96,165,250,.55); background: rgba(255,255,255,.06); }
    .cell-small { min-width: 80px; }
    .th-tools { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .mini { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 3px 6px; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 7px 9px;
      font-size: 12px;
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .status-good { color: #bbf7d0; background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.28); }
    .status-warn { color: #fef3c7; background: rgba(234,179,8,.10); border-color: rgba(234,179,8,.28); }
    .status-bad { color: #fecaca; background: rgba(239,68,68,.10); border-color: rgba(239,68,68,.28); }

    .day-grid { grid-template-columns: repeat(7, minmax(230px, 1fr)); overflow-x: auto; padding-bottom: 4px; }
    .day-card { min-height: 240px; }
    .entry {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.035);
    }
    .entry-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; margin-bottom: 7px; }

    .metric-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .mini-metric { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.035); }
    .mini-metric strong { display: block; font-size: 24px; letter-spacing: -.04em; }
    .mini-metric span { color: var(--muted); font-size: 12px; }

    .chart-box {
      min-height: 340px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(6,10,18,.54), rgba(255,255,255,.025));
      padding: 12px;
      overflow: hidden;
    }
    .chart-box svg { width: 100%; height: 315px; display: block; }
    .chart-box.large svg { height: min(68vh, 720px); }
    .chart-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .chart-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .chart-type-select { width: 145px; min-height: 34px; padding: 7px 9px; border-radius: 10px; }
    .chart-modal-root:empty { display: none; }
    .chart-modal-root {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(3,7,18,.76);
      backdrop-filter: blur(12px);
      padding: 24px;
      display: grid;
      place-items: center;
    }
    .chart-modal-panel {
      width: min(1320px, 96vw);
      max-height: 92vh;
      overflow: auto;
      border: 1px solid var(--line-2);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(17,26,45,.98), rgba(8,13,24,.98));
      box-shadow: var(--shadow);
      padding: 18px;
    }
    body.modal-open { overflow: hidden; }
    .empty {
      border: 1px dashed var(--line-2);
      color: var(--muted);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      background: rgba(255,255,255,.025);
    }

    .footer {
      color: var(--muted);
      text-align: center;
      padding: 26px 0 8px;
      font-size: 13px;
    }

    .hidden-file { display: none; }


    /* Team 2 / Team 3 expanded dashboard additions */
    .section-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .mini-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
    .flex-th { min-width: 150px; vertical-align: top; }
    .flex-th-stack { display:grid; gap:7px; }
    .flex-th-actions { display:flex; gap:6px; align-items:center; }
    .tiny-select { min-height: 30px; padding:5px 7px; border-radius:9px; min-width:92px; }
    .tiny-btn { padding:6px 8px !important; border-radius:9px !important; min-height:30px !important; }
    .status-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:16px; }
    .status-row { display:grid; grid-template-columns: 1fr 145px auto; gap:10px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:14px; background: rgba(255,255,255,.025); margin-top:8px; }
    .status-pill { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width: 105px; padding:8px 10px; border-radius:999px; border:1px solid var(--line); font-size:12px; font-weight:800; }
    .status-pill::before { content:''; width:9px; height:9px; border-radius:50%; background: currentColor; box-shadow:0 0 14px currentColor; }
    .status-pill.green { color:#86efac; background:rgba(34,197,94,.09); border-color:rgba(34,197,94,.32); }
    .status-pill.yellow { color:#fde68a; background:rgba(234,179,8,.10); border-color:rgba(234,179,8,.30); }
    .status-pill.red { color:#fecaca; background:rgba(239,68,68,.10); border-color:rgba(239,68,68,.30); }
    .bullet-row { display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); }
    .bullet-row:last-child { border-bottom:none; }
    .report-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .chart-box.tall { min-height: 360px; }
    .chart-caption { color:var(--muted); font-size:12px; margin-top:8px; }
    .print-only { display:none; }


    /* Premium flexibility and theme polish */
    h1, h2, h3, p, .btn, .pill, .week-chip strong { overflow-wrap: anywhere; }
    .card-head > div { min-width: 0; max-width: 100%; }
    .label-textarea {
      display: block;
      width: min(100%, 720px);
      min-width: min(260px, 100%);
      min-height: 34px;
      height: auto;
      overflow: hidden;
      resize: none;
      line-height: 1.18;
      white-space: normal;
      word-break: break-word;
      font-size: inherit;
    }
    .page-title .label-textarea, h2 .label-textarea { font-size: 30px; letter-spacing: -.04em; }
    .flex-th-row { display:flex; align-items:flex-start; gap:8px; }
    .remove-col-btn {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 9px;
      border: 1px solid rgba(239,68,68,.30);
      background: transparent;
      color: #fca5a5;
      font-weight: 900;
      line-height: 1;
    }
    .remove-col-btn:hover { background: rgba(239,68,68,.10); border-color: rgba(239,68,68,.58); }
    .flex-th-stack, .flex-th-actions, .tiny-select { display: none; }
    body.theme-light .card, body.theme-light .hero {
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.94));
    }
    body.theme-light .btn { background: rgba(255,255,255,.80); color: var(--text); }
    body.theme-light .btn.primary { color: #fff; background: linear-gradient(135deg, #2563eb, #7c3aed); }
    body.theme-light table { background: rgba(255,255,255,.78); }
    body.theme-light th { color: #334155; background: rgba(15,23,42,.045); }
    body.theme-light .th-label-input { color: #334155; }
    body.theme-light .chart-box { background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(241,245,249,.92)); }
    body.theme-light select, body.theme-light .cell-select, body.theme-light input[type="date"] { color-scheme: light; }
