<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOC Weekly Operations Dashboard</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#050914;
      --bg2:#07111f;
      --panel:#0d1728;
      --panel2:#111f34;
      --soft:#16263e;
      --line:#24405f;
      --text:#edf7ff;
      --muted:#9db3c9;
      --dim:#6f849d;
      --accent:#39d0ff;
      --accent2:#7c5cff;
      --good:#22c55e;
      --warn:#d97706;
      --bad:#ef4444;
      --amberBg:#3a2504;
      --amberText:#ffd98a;
      --shadow:0 20px 55px rgba(0,0,0,.36);
      --radius:18px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    [data-theme="light"]{
      color-scheme: light;
      --bg:#eef3f8;
      --bg2:#f7fafc;
      --panel:#ffffff;
      --panel2:#f8fbff;
      --soft:#eef4fb;
      --line:#c8d7e7;
      --text:#102033;
      --muted:#50657a;
      --dim:#6f7f91;
      --accent:#0369a1;
      --accent2:#5b21b6;
      --good:#15803d;
      --warn:#92400e;
      --bad:#b91c1c;
      --amberBg:#f5c84b;
      --amberText:#2d1a00;
      --shadow:0 18px 44px rgba(39,57,83,.12);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:
        radial-gradient(circle at 18% 2%, rgba(57,208,255,.18), transparent 26%),
        radial-gradient(circle at 82% 8%, rgba(124,92,255,.16), transparent 24%),
        linear-gradient(135deg,var(--bg),var(--bg2));
      font-size:13px;
      overflow:hidden;
    }
    button,input,select,textarea{font:inherit;color:var(--text)}
    button{cursor:pointer}
    .app{height:100vh;display:grid;grid-template-columns:88px 1fr;grid-template-rows:72px 1fr;grid-template-areas:"rail top" "rail main";}
    .rail{grid-area:rail;background:linear-gradient(180deg,rgba(8,14,26,.96),rgba(10,19,34,.92));border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;}
    [data-theme="light"] .rail{background:linear-gradient(180deg,#ffffff,#eef5fb)}
    .logoBox{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:-1px;color:#fff;box-shadow:0 10px 30px rgba(57,208,255,.22)}
    .railNav{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center;margin-top:8px}
    .navBtn{width:62px;height:56px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;line-height:1.05;white-space:normal;text-align:center;}
    .navBtn .ico{font-size:17px;color:var(--muted)}
    .navBtn.active,.navBtn:hover{border-color:rgba(57,208,255,.45);background:linear-gradient(135deg,rgba(57,208,255,.13),rgba(124,92,255,.10));color:var(--text)}
    .navBtn.active .ico,.navBtn:hover .ico{color:var(--accent)}
    .top{grid-area:top;border-bottom:1px solid var(--line);background:rgba(8,14,26,.76);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:18px;}
    [data-theme="light"] .top{background:rgba(255,255,255,.80)}
    .titleBlock{min-width:240px}.titleBlock h1{margin:0;font-size:18px;line-height:1.15;letter-spacing:-.3px}.titleBlock p{margin:3px 0 0;color:var(--muted);font-size:11px}
    .topControls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .chipBtn,.iconBtn,.select,.dateInput,.fileLabel{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:12px;min-height:34px;padding:0 10px;color:var(--text);box-shadow:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;}
    .chipBtn{font-size:12px;font-weight:700}.iconBtn{width:34px;height:34px;padding:0;font-size:15px}.iconBtn.danger{color:var(--bad)}.iconBtn.add{color:var(--accent);font-weight:900;font-size:20px}.iconBtn:hover,.chipBtn:hover{border-color:var(--accent)}
    .select{padding:0 30px 0 10px;appearance:auto}.dateInput{width:132px;color-scheme:dark}[data-theme="light"] .dateInput{color-scheme:light}.fileInput{display:none}
    .main{grid-area:main;overflow:auto;padding:18px 20px 34px;scroll-behavior:auto;}
    .page{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
    .hero{display:grid;grid-template-columns:minmax(260px,1.2fr) repeat(4,minmax(120px,.55fr));gap:12px;align-items:stretch}
    .heroMain,.metric,.section,.chartCard,.workspace,.homeCard{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
    .heroMain{padding:18px;position:relative;overflow:hidden}.heroMain:before{content:"";position:absolute;inset:-80px -100px auto auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(57,208,255,.18),transparent 68%)}
    .eyebrow{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:900}.heroMain h2{margin:8px 0 8px;font-size:25px;letter-spacing:-.6px}.heroMain p{margin:0;color:var(--muted);line-height:1.45;max-width:760px}
    .metric{padding:14px}.metric .num{font-size:25px;font-weight:900;letter-spacing:-.6px}.metric .lbl{font-size:11px;color:var(--muted);margin-top:4px}.metric.good{border-color:rgba(34,197,94,.4)}.metric.warn{border-color:rgba(217,119,6,.44)}.metric.bad{border-color:rgba(239,68,68,.45)}
    .homeGrid{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:14px}.homeCard{padding:18px;min-height:170px;position:relative;overflow:hidden}.homeCard h3{margin:0 0 8px;font-size:18px}.homeCard p{margin:0;color:var(--muted);line-height:1.5}.homeCard .open{position:absolute;right:14px;bottom:14px}.homeCard:after{content:"";position:absolute;right:-38px;top:-38px;width:110px;height:110px;border-radius:32px;transform:rotate(20deg);background:linear-gradient(135deg,rgba(57,208,255,.18),rgba(124,92,255,.18))}
    .teamLayout{display:grid;grid-template-columns:320px minmax(0,1fr) 340px;gap:14px;align-items:start}.leftStack,.rightStack,.centerStack{display:flex;flex-direction:column;gap:14px;min-width:0}
    .section{overflow:hidden}.sectionHead{min-height:48px;padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionTitle{display:flex;align-items:center;gap:9px;min-width:0}.sectionTitle h3{margin:0;font-size:14px;line-height:1.25;letter-spacing:-.1px;white-space:normal;overflow-wrap:anywhere}.sectionTitle .tag{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}.sectionActions{display:flex;align-items:center;gap:6px;flex-shrink:0}.sectionBody{padding:13px}.section.collapsed .sectionBody{display:none}.section.collapsed .collapseBtn{transform:rotate(-90deg)}
    .fieldGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.10em;color:var(--dim);font-weight:800}
    input,textarea,select{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:11px;min-height:34px;padding:8px 10px;outline:none}.denseInput{min-width:0;min-height:30px;padding:6px 7px;font-size:12px}.subjectInput{min-width:min(760px,100%);width:auto;max-width:100%;display:inline-block}.subjectInput input{min-width:min(720px,100%)}
    textarea{resize:none;overflow:hidden;line-height:1.45}.inputRow{display:flex;gap:8px;align-items:center}.inputRow>*{min-width:0}.inputRow .grow{flex:1}.smallMuted{font-size:11px;color:var(--muted)}
    .dayList{display:flex;flex-direction:column;gap:9px}.dayBox{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:14px;padding:10px}.dayTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.dayTop strong{font-size:12px}.entry{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:8px;margin-top:7px}.entryMeta{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:10px;margin-bottom:6px}.entry .iconBtn{width:26px;height:26px;font-size:12px}
    .concern{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:12px;background:var(--amberBg);color:var(--amberText);font-size:12px;font-weight:750;margin-top:7px}.concern input{background:transparent;border:0;color:inherit;min-height:26px;padding:0}.concern .iconBtn{width:26px;height:26px;border-color:rgba(0,0,0,.18)}
    .tableWrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:14px}.dataTable{width:100%;border-collapse:collapse;table-layout:auto;min-width:0}.dataTable th,.dataTable td{border-bottom:1px solid var(--line);padding:7px 7px;vertical-align:top;text-align:left}.dataTable th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:rgba(255,255,255,.035);white-space:normal;line-height:1.2}.dataTable td{font-size:12px}.dataTable tr:last-child td{border-bottom:0}.dataTable input,.dataTable select,.dataTable textarea{min-height:30px;padding:6px 7px;font-size:12px;border-radius:9px}.dataTable textarea{min-width:150px}.dataTable .tinyCol{width:42px;min-width:42px;text-align:center}.dataTable .dateCol{min-width:106px}.dataTable .numCol{max-width:86px}.dataTable .wideCol{min-width:160px}.dataTable .compactCol{max-width:118px}
    .statusDot{width:13px;height:13px;border-radius:99px;display:inline-block;box-shadow:0 0 0 4px rgba(255,255,255,.04)}.s-good{background:var(--good)}.s-warn{background:var(--warn)}.s-bad{background:var(--bad)}.statusPill{height:26px;min-width:38px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--soft)}
    .chartGrid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px}.chartCard{overflow:hidden}.chartCanvas{min-height:230px;padding:10px}.chartCanvas svg{width:100%;height:230px;display:block}.legend{display:flex;flex-wrap:wrap;gap:10px;padding:0 12px 12px;color:var(--muted);font-size:11px}.legend span{display:inline-flex;align-items:center;gap:5px}.swatch{width:10px;height:10px;border-radius:3px;display:inline-block}.empty{border:1px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted);text-align:center;background:rgba(255,255,255,.025)}
    .operatorGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.operator{border:1px solid var(--line);background:linear-gradient(180deg,var(--soft),var(--panel2));border-radius:16px;padding:11px;display:grid;grid-template-columns:42px 1fr 28px;gap:9px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}.operator h4{margin:0;font-size:13px}.operator p{margin:2px 0 0;color:var(--muted);font-size:11px}.operator .id{font-size:10px;color:var(--dim);margin-top:2px}
    .riskList{display:flex;flex-direction:column;gap:8px}.riskTicket{border:1px solid var(--line);border-left:4px solid var(--warn);background:rgba(255,255,255,.025);border-radius:13px;padding:9px}.riskTicket.critical{border-left-color:var(--bad)}.riskTicket.low{border-left-color:var(--good)}.riskTicket h4{margin:0 0 5px;font-size:13px}.riskTicket p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.opsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.opsItem{border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.opsItem button{background:transparent;border:0;padding:0;display:flex;align-items:center;gap:8px;color:var(--text)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:99;display:none;align-items:center;justify-content:center;padding:28px}.modal.open{display:flex}.modalCard{width:min(1100px,95vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.modalHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.modalBody{padding:16px}.modal .chartCanvas svg{height:560px}
    .toast{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);color:var(--text);display:none;z-index:120}.toast.show{display:block}
    .footer{text-align:center;color:var(--dim);font-size:11px;padding:8px}
    @media (max-width:1240px){.teamLayout{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr}.homeGrid{grid-template-columns:1fr 1fr}.chartGrid{grid-template-columns:1fr}.leftStack,.rightStack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh;display:block}.rail{position:sticky;top:0;z-index:8;flex-direction:row;width:100%;height:auto;overflow:auto}.railNav{flex-direction:row;margin:0}.top{position:sticky;top:82px;z-index:7;align-items:flex-start;flex-direction:column;height:auto;padding:12px}.main{overflow:visible;padding:12px}.hero,.homeGrid,.fieldGrid,.leftStack,.rightStack{grid-template-columns:1fr}.navBtn{min-width:64px}}
    @media print{body{background:#fff;color:#000;overflow:visible}.rail,.top,.sectionActions,.iconBtn,.chipBtn,.fileLabel{display:none!important}.app{display:block}.main{overflow:visible}.section,.chartCard,.metric,.heroMain{box-shadow:none;border-color:#ccc;break-inside:avoid}.page{max-width:none}.teamLayout,.chartGrid,.hero,.homeGrid{display:block}.section,.chartCard,.metric{margin-bottom:12px}}
  </style>
</head>
<body data-theme="dark">
  <div id="app"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>
  <input class="fileInput" type="file" id="importFile" accept="application/json,.json" />
  <script src="app.js" defer></script>
</body>
</html>
